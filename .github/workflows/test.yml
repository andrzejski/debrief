name: Test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # The app ships as an Arch package built against Arch's Qt, so it's tested there.
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for the checkout
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Install the package's dependencies
        # The PKGBUILD is the one list of what the app needs, so CI reads it rather than keeping a copy.
        run: |
          source packaging/arch/PKGBUILD
          deps=("${depends[@]}" "${makedepends[@]}" "${checkdepends[@]}")
          pacman -S --noconfirm --needed base-devel cmake dbus "${deps[@]%%[<>=]*}"

      - name: Set up a user and a locale like a desktop's
        # Root can read any file, so tests about unreadable ones need an ordinary user, with a second group for tests that change a file's group; and the container generates no locale.
        run: |
          useradd -m tester
          groupadd other
          usermod -aG other tester
          chown -R tester .
          sed -i 's/^#en_US.UTF-8/en_US.UTF-8/' /etc/locale.gen
          locale-gen

      - name: Build
        run: su tester -c bin/build

      - name: Test
        run: su tester -c 'LANG=en_US.UTF-8 dbus-run-session -- bin/test'

  macos:
    name: Build, test, and package (macOS, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: qtmultimedia
          cache: true

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure --no-tests=error

      - name: Package
        # The same script a release uses, so a broken package shows up here first.
        run: bash packaging/macos/build.sh

      - name: Check the packaged app answers
        run: |
          app="$(echo build-macos/Debrief-*-macos-*/Debrief.app)"
          "$app/Contents/MacOS/Debrief" --version
          "$app/Contents/MacOS/Debrief" prompt sop > /dev/null
          ls "$app/Contents/Resources/models"

      - uses: actions/upload-artifact@v4
        with:
          name: Debrief-macos-${{ matrix.arch }}
          path: |
            build-macos/Debrief-*-macos-*.zip
            build-macos/Debrief-*-macos-*.zip.sha256
          retention-days: 14
